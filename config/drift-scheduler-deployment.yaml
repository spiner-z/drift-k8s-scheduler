apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drift-scheduler
  template:
    metadata:
      labels:
        app: drift-scheduler
        component: scheduler
        tier: control-plane
    spec:
      serviceAccountName: drift-scheduler       # 使用前面创建的 SA
      containers:
        - name: drift-scheduler
          image: yourrepo/drift-k8s-scheduler:v1   # 使用之前构建的镜像
          imagePullPolicy: IfNotPresent
          command:
            - /drift-scheduler
            - --config=/etc/kubernetes/scheduler-config.yaml
            - --v=2                            # 日志级别，可调高以调试
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes/       # 挂载ConfigMap中配置文件
      volumes:
        - name: config
          configMap:
            name: drift-scheduler-config
            items:
              - key: scheduler-config.yaml
                path: scheduler-config.yaml
